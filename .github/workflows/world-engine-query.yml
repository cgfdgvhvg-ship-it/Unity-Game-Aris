name: AI Unity physics and capture query
run-name: World engine query TTL=${{ inputs.ttl_hours }}h
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: 'Engine request: export, probe with target/waypoints, or capture'
        required: true
        default: '{"command":"export"}'
        type: string
      ttl_hours:
        type: choice
        description: Query output lifetime in hours, cleaned at next successful schedule
        options: ['1', '2', '6', '24']
        default: '2'
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - name: Explain Unity runner requirement
        env:
          UNITY_RUNNER: ${{ vars.WORLD_UNITY_RUNNER }}
        run: |
          if [ -z "$UNITY_RUNNER" ]; then
            echo 'Unity query skipped: configure WORLD_UNITY_RUNNER and UNITY_EDITOR_PATH as documented in Docs/WORLD_AUTOMATION.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
  engine:
    if: vars.WORLD_UNITY_RUNNER != ''
    runs-on: [self-hosted, linux, '${{ vars.WORLD_UNITY_RUNNER }}']
    timeout-minutes: 45
    concurrency:
      group: aaris-unity-automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt
      - name: Write bounded JSON engine request
        env:
          WORLD_REQUEST: ${{ inputs.request_json }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          raw=os.environ['WORLD_REQUEST']; assert len(raw.encode())<=32768
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'world-query';p.mkdir(exist_ok=True)
          (p/'request.json').write_text(json.dumps(json.loads(raw)))
          PY
      - name: Run isolated Unity project
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
          AARIS_WORLD_TEMP: ${{ runner.temp }}/world-query
        run: python Tools/World/world.py --out "$RUNNER_TEMP/world-query/report.json" engine --request "$RUNNER_TEMP/world-query/request.json" --capture-dir "$RUNNER_TEMP/world-query"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-engine-query-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/world-query/report.json
            ${{ runner.temp }}/world-query/capture.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Remove runner reports
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/world-query"
