name: Aaris Unity Screenshot (Codespace)

on:
  workflow_dispatch:
    inputs:
      codespace:
        description: "Exact active Codespace name"
        required: true
        type: string
        default: "aaris-ai-ubuntu-minimal-4qr6v94w9rwvhjgp6"
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: aaris-unity-screenshot
  cancel-in-progress: false

jobs:
  capture:
    # Only the owner's command on the dedicated issue, or owner dispatch.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'sundamunda289-art') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 77 &&
       github.event.comment.user.id == 353065137 &&
       startsWith(github.event.comment.body, 'AARIS SCREENSHOT '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch visible Unity window from running Codespace
        id: screenshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          INPUT_CODESPACE: ${{ inputs.codespace }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Missing CODESPACE_PAT secret; use the Codespace account currently selected by Turbo bootstrap."
            exit 2
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            [[ "${COMMENT_BODY}" =~ ^AARIS[[:space:]]SCREENSHOT[[:space:]]([A-Za-z0-9-]{3,120})$ ]] || {
              echo "::error::Expected AARIS SCREENSHOT <exact-codespace-name>"
              exit 3
            }
            codespace="${BASH_REMATCH[1]}"
          else
            codespace="${INPUT_CODESPACE}"
          fi
          [[ "${codespace}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{2,119}$ ]] || {
            echo "::error::Invalid Codespace name"
            exit 4
          }
          echo "Capturing only the Unity Editor window from ${codespace}."
          remote_file="aaris-unity-window-${GITHUB_RUN_ID}.jpg"
          # Force Unity foreground, capture just that window. Never print screenshot
          # bytes or capture full desktop in the public CI logs.
          remote_command="set -eu; cd ~; export DISPLAY=:99; w=\$(xdotool search --onlyvisible --name '^Unity - Unity-Game-Aris -' | head -n 1); test -n \"\$w\"; xdotool windowactivate --sync \"\$w\"; scrot -u -o -q 85 '${remote_file}'; test -s '${remote_file}'"
          gh codespace ssh -c "${codespace}" "${remote_command}"
          gh codespace cp -c "${codespace}" "remote:${remote_file}" "${RUNNER_TEMP}/AarisUnityScreen.jpg"
          test -s "${RUNNER_TEMP}/AarisUnityScreen.jpg"
          [[ "$(file --brief --mime-type "${RUNNER_TEMP}/AarisUnityScreen.jpg")" == "image/jpeg" ]] || {
            echo "::error::Codespace screenshot is not a JPEG."
            exit 5
          }
          echo "Verified Unity screenshot JPEG; no image data printed to Actions logs."
      - name: Downloadable screenshot (expires after one day)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AarisUnityScreenshot-${{ github.run_id }}
          path: ${{ runner.temp }}/AarisUnityScreen.jpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
