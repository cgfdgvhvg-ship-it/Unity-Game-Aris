name: Save human scale and daylight core assets
on:
  push:
    branches: [fix/world-scale-daylight-20261103]
    paths:
      - 'Assets/AarisWorld/Scripts/**'
      - 'Tools/MapBuild/world_review.py'
      - 'Tools/Validation/check_world_review.py'
      - '.github/workflows/world-review-core.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aaris-world-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  save-and-check-world:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline native tools
        run: |
          python -m pip install -r Tools/MapBuild/requirements.txt
          python -m pip install tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - name: Fetch the original core mesh, terrain and pipeline bytes
        run: |
          git lfs install --local
          git lfs pull --include="Assets/AarisWorld/**/*.asset,Assets/TerrainDemoScene_URP/Terrain/Data/*.asset,Assets/TerrainDemoScene_URP/Settings/URP/*.asset"
      - name: Save scaled homes, native cypress instances and brighter daylight
        run: python -u Tools/MapBuild/world_review.py
      - name: Verify a second save cannot compound scale or change output
        run: |
          python - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'Tools/MapBuild')
          from world_review import save_world,save_native
          root=Path.cwd()
          paths=[*Path('Assets/AarisWorld/Models').glob('*/*.prefab'),*Path('Assets/AarisWorld/Surfaces').glob('Foundation_*.asset'),*Path('Assets/TerrainDemoScene_URP/Terrain/Data').glob('*.asset'),Path('Assets/TerrainDemoScene_URP/Scenes/TerrainDemoScene.unity'),Path('Assets/TerrainDemoScene_URP/Prefabs/Skybox/Materials/Sky.mat'),Path('Assets/AarisWorld/Player/AarisPlayer.prefab'),Path('Docs/CYPRESS_SCALE_TARGETS.json'),Path('Docs/MAP_LAYOUT.json')]
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          save_world(root);save_native(root)
          assert before=={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},'Repeated native authoring changed saved scale/assets'
          print('Native world authoring is byte-for-byte idempotent')
          PY
      - name: Validate saved scale, daylight, references and native mesh buffers
        run: |
          python Tools/Validation/check_world_review.py --native
          python Tools/MapBuild/validate_map.py
          python Tools/Validation/check_explorer.py --native
          python Tools/Validation/check_road_markings.py
      - name: Commit verified core asset bytes and measured reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Docs
          git diff --cached --quiet || git commit -m "Save integrated building prefabs, world proportions and clear daylight"
          git push origin HEAD:"${GITHUB_REF_NAME}"
