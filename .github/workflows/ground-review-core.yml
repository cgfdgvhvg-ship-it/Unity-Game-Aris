name: Ground player and native forest assets
on:
  push:
    branches: [fix/ground-player-20261103]
    paths:
      - 'Assets/AarisWorld/Scripts/**'
      - 'Tools/MapBuild/ground_*.py'
      - '.github/workflows/ground-review-core.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aaris-ground-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  author-and-check-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native serialization tools
        run: |
          python -m pip install -r Tools/MapBuild/requirements.txt
          python -m pip install tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - name: Fetch only the native terrain and generated meshes
        run: |
          git lfs install --local
          git lfs pull --include="Assets/AarisWorld/**/*.asset,Assets/TerrainDemoScene_URP/Terrain/Data/*.asset"
      - name: Save native forest instances and real building LOD meshes
        run: python -u Tools/MapBuild/ground_native.py
      - name: Validate saved gameplay, clearances, assets and C# syntax
        run: python Tools/Validation/check_explorer.py --native
      - name: Commit verified native assets to this working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Docs
          git diff --cached --quiet || git commit -m "Save native forest planting and near/middle/far building meshes"
          git push origin HEAD:"${GITHUB_REF_NAME}"
