name: AI world query
run-name: World query TTL=${{ inputs.ttl_hours }}h
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: 'Read-only request, e.g. {"command":"height","x":-496,"z":-212}'
        required: true
        default: '{"command":"context"}'
        type: string
      ttl_hours:
        description: Delete completed query run/logs/artifacts after TTL at next successful cleanup
        type: choice
        options: ['1', '2', '6', '24']
        default: '2'
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt
      - name: Materialize the request's core assets within a 1GiB budget
        env:
          WORLD_REQUEST: ${{ inputs.request_json }}
        run: python Tools/World/fetch_assets.py
      - name: Run structured request without shell evaluation
        env:
          WORLD_REQUEST: ${{ inputs.request_json }}
        run: python Tools/World/world.py --out "$RUNNER_TEMP/world-query/report.json" request
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-query-${{ github.run_id }}
          path: ${{ runner.temp }}/world-query/report.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Remove runner report
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/world-query"
