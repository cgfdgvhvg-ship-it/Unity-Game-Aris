name: Aaris Python Map Worker (No Unity License)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/python-map-operations.yml'
      - 'Tools/CI/map_static_check.py'
      - 'Tools/CI/layout_preview.py'
      - 'Assets/**'
      - 'Tools/MapBuild/**'
      - 'Tools/Validation/**'
      - 'Docs/MAP_LAYOUT.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit / inspect / apply-render-materials (manual branch PR only)'
        type: choice
        required: true
        default: audit
        options: [audit, inspect, apply-render-materials]
      x:
        description: 'Inspect X coordinate (-1000 to 1000 meters)'
        required: false
        default: '0'
        type: string
      z:
        description: 'Inspect Z coordinate (-1000 to 1000 meters)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aaris-python-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-map:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      MAP_MODE: ${{ inputs.mode || 'audit' }}
      MAP_X: ${{ inputs.x || '0' }}
      MAP_Z: ${{ inputs.z || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Validate map Python and license-free metadata
        run: |
          set -euo pipefail
          python3 -m compileall -q Tools/CI Tools/MapBuild Tools/Validation
          if [[ "$MAP_MODE" == "inspect" ]]; then
            python3 Tools/CI/map_static_check.py inspect --x "$MAP_X" --z "$MAP_Z" --out ci-map-report.json
          else
            python3 Tools/CI/map_static_check.py audit --out ci-map-report.json
          fi
      - name: Render real layout-derived QA PNGs without a Unity license
        id: layout_preview
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 Tools/CI/layout_preview.py
      - name: Publish latest layout overview and four terrain tiles
        if: steps.layout_preview.outcome == 'success'
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(ci-layout-preview/*.png ci-layout-preview/*.json)
          test "${#images[@]}" -eq 6
          if ! gh release view layout-review --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create layout-review --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Aaris automated map layout review (not a Unity render)" \
              --notes "Coordinates from Docs/MAP_LAYOUT.json; geometry/layout QA only. No Unity, no URP shader or actual skybox screenshots."
          fi
          gh release upload layout-review --repo "$GITHUB_REPOSITORY" --clobber "${images[@]}"
      - name: Upload license-free map previews to Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-map-layout-previews-${{ github.run_id }}
          path: ci-layout-preview/
          retention-days: 30
          if-no-files-found: warn
      - name: Set up Python native map editor only for explicit edit requests
        if: env.MAP_MODE == 'apply-render-materials'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r Tools/MapBuild/requirements.txt
          git lfs install --local
          git lfs pull --include="Assets/AarisWorld/**,Assets/TerrainDemoScene_URP/Settings/URP/**" --exclude=""
      - name: Apply audited native material/URP synchronisation via Python
        if: env.MAP_MODE == 'apply-render-materials'
        run: |
          set -euo pipefail
          python3 Tools/MapBuild/render_review.py --apply
          git diff --check
      - name: Create review branch for changes (never silently modify main)
        if: env.MAP_MODE == 'apply-render-materials'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Docs
          if git diff --cached --quiet; then
            echo 'No native material changes. Existing map already matches source.'
            exit 0
          fi
          branch="ci/python-map-materials-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git commit -m 'ci(map): propose source-correct Unity material synchronisation'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title 'Python map: source-correct URP materials (review required)' \
            --body 'License-free native-material update. This PR is NOT a Unity render verification. Review the changes before merge.'
      - name: Upload map QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-map-qa-${{ github.run_id }}
          path: ci-map-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          echo '### Python native-map worker' >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $MAP_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow never installs Unity, reads UNITY_LICENSE, or waits for Unity login.' >> "$GITHUB_STEP_SUMMARY"
          echo "Schematic review images: https://github.com/$GITHUB_REPOSITORY/releases/tag/layout-review" >> "$GITHUB_STEP_SUMMARY"
