name: Aaris Codespaces AI Terminal and Screenshots
on:
  push:
    paths:
      - '.github/workflows/aaris-codespaces-control.yml'
      - '.devcontainer/**'
      - 'Tools/Codespaces/**'
      - 'Docs/CODESPACES_AI_CONTROL.md'
      - 'Docs/CODESPACES_FAST_START.md'
      - 'AGENTS.md'
      - 'Assets/AarisWorld/Editor/AarisCodespaceSceneProbe.cs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aaris-codespaces-control.yml'
      - '.devcontainer/**'
      - 'Tools/Codespaces/**'
      - 'Docs/CODESPACES_AI_CONTROL.md'
      - 'Docs/CODESPACES_FAST_START.md'
      - 'AGENTS.md'
      - 'Assets/AarisWorld/Editor/AarisCodespaceSceneProbe.cs'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Safe Codespaces task'
        type: choice
        required: true
        default: machines
        options: [machines, info, quota, start, fresh, fresh_ssh, rebuild, status, logs, sync, lfs, lfs_report, changes, preserve_assets, retry_assets, install, deps, cli_diag, editor, editor_diag, license, auth, probe, shot, accept_terms, safe_mode, compile_report, refresh, close_editor, editor_process, editor_recover, scene_render, scene_play, drop_video, drop_frames, map_verify, photo, play_diag, foliage_diag, tree_audit, tree_preview, tree_publish, tree_report, test, stop]
      machine:
        description: 'Optional exact machine name, from machines result'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  static-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate commands without Codespace credentials
        run: |
          set -euo pipefail
          bash -n .devcontainer/*.sh Tools/Codespaces/*.sh
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
          python3 -m py_compile Tools/Codespaces/mobile_license.py Tools/Codespaces/auth_bridge.py Tools/Codespaces/relay_probe.py Tools/Codespaces/verify_lfs.py
          python3 Tools/Codespaces/mobile_license.py --selftest
          python3 Tools/Codespaces/auth_bridge.py --selftest
          openssl pkey -pubin -in Tools/Codespaces/approval_relay_public.pem -noout
          node --check Tools/CI/cloudflare_private_approval_worker.mjs
          python3 Tools/Codespaces/codespace_logs.py --selftest
          python3 Tools/Codespaces/billing_quota.py --selftest
          python3 -m py_compile Tools/Codespaces/publish_tree_mass_from_actions.py
          python3 -m py_compile Tools/Codespaces/restore_local_tree_lfs.py
          python3 Tools/Codespaces/restore_preserved_source_lfs.py --selftest
          python3 -m py_compile Tools/Codespaces/recover_verified_tree_lfs.py
          python3 Tools/Codespaces/test_protocol.py
          # Regression: long-lived Codespace commands must never block PR CI.
          python3 - <<'PYCONCURRENCY'
          from pathlib import Path
          workflow = Path('.github/workflows/aaris-codespaces-control.yml').read_text()
          assert '\nconcurrency:\n  group: aaris-codespace-control' not in workflow
          assert ('  control:\n    # Serialize only remote machine operations; do not block PR static CI.\n'
                  '    concurrency:\n      group: aaris-codespace-control\n'
                  '      cancel-in-progress: false') in workflow
          assert '  static-check:\n' in workflow and '  control:\n' in workflow
          print('AARIS_CODESPACE_JOB_SCOPED_CONCURRENCY_PASS')
          PYCONCURRENCY
          python3 Tools/Codespaces/test_scene_probe.py
          python3 Tools/Validation/check_saved_ambient.py
          python3 Tools/Codespaces/photo_request.py --selftest
          bash -n Tools/Codespaces/play_probe_diagnostic.sh
          echo "CODESPACE_STATIC_PASS"
      - name: Verify immutable native Unity bake expected by the Codespace handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/aaris-verified-bake"
          gh run download 42472771253 -R "$GITHUB_REPOSITORY" \
            --name aaris-codespace-42472771253 -D "$RUNNER_TEMP/aaris-verified-bake"
          test "$(sha256sum "$RUNNER_TEMP/aaris-verified-bake/mass-package.tar.gz" | cut -d ' ' -f1)" = \
            "234024b842e8cc5e1253607ce41b5a6aebec6a7abd3c9fd81837bc960a24197d"
          python3 Tools/Codespaces/recover_verified_tree_lfs.py --verify \
            "$RUNNER_TEMP/aaris-verified-bake/mass-package.tar.gz"
  control:
    # Serialize only remote machine operations; do not block PR static CI.
    concurrency:
      group: aaris-codespace-control
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 77 &&
       github.event.comment.user.login == 'sundamunda289-art' &&
       startsWith(github.event.comment.body, 'CS '))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Execute reviewed Codespace task
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          AARIS_ISSUE_REPLY_TOKEN: ${{ github.token }}
          ISSUE_COMMAND: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          REQUEST_OPERATION: ${{ inputs.operation }}
          REQUEST_MACHINE: ${{ inputs.machine }}
        run: bash Tools/Codespaces/controller.sh
      - name: Upload bounded outputs and screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-codespace-${{ github.run_id }}
          path: codespace-results/
          if-no-files-found: warn
          retention-days: 2
      - name: Reply to owner control issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/Codespaces/issue_response.py codespace-results/ > /tmp/aaris-response.md
          printf '\n[Run details and screenshot artifact](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/aaris-response.md
          gh issue comment 77 -R "$GITHUB_REPOSITORY" -F /tmp/aaris-response.md
