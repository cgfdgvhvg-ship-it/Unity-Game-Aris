name: Aaris native door and glass Play Mode verification
on:
  pull_request:
    paths:
      - 'Assets/AarisWorld/Scripts/AarisBreakablePanel.cs'
      - 'Assets/AarisWorld/Scripts/AarisModularHouse.cs'
      - 'Assets/AarisWorld/Scripts/AarisSettlementExpansion.cs'
      - 'Assets/AarisWorld/Editor/AarisInteractiveHouseProbe.cs'
      - 'Assets/Resources/AarisExpansion/WorldExpansionPlan.json'
      - 'Tools/Codespaces/interactive_house_probe.sh'
      - '.github/workflows/aaris-interactive-door-native.yml'
jobs:
  real-unity-editor:
    if: github.event.pull_request.number == 218 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aaris-codespace-control
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: false
          persist-credentials: false
      - name: Verify shell syntax and static Unity integration
        run: |
          set -euo pipefail
          bash -n Tools/Codespaces/interactive_house_probe.sh
          python3 Tools/Validation/test_settlement_expansion.py
          grep -q 'SNAPSHOTS=/tmp/aaris-native-photo-worktrees' Tools/Codespaces/interactive_house_probe.sh
          ! grep -Eq 'git reset --hard|git clean -fd|git stash|git push --force' Tools/Codespaces/interactive_house_probe.sh
      - name: Fetch original authenticated Unity mesh archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aaris-original-mesh"
          gh run download 42472771253 -R "$GITHUB_REPOSITORY" \
            --name aaris-codespace-42472771253 \
            -D "$RUNNER_TEMP/aaris-original-mesh"
          FILE="$RUNNER_TEMP/aaris-original-mesh/mass-package.tar.gz"
          test "$(stat -c '%s' "$FILE")" = "4757727"
          test "$(sha256sum "$FILE" | cut -d ' ' -f1)" = \
            "234024b842e8cc5e1253607ce41b5a6aebec6a7abd3c9fd81837bc960a24197d"
      - name: Test PR on the unchanged old Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p native-door-results
          CS=aaris-ai-unity-ssh-vp5g97jv4r4gfpjgq
          test -n "$GH_TOKEN" || { echo AARIS_CODESPACE_AUTH_MISSING; exit 31; }
          LIST="$(gh codespace list -R "$GITHUB_REPOSITORY" \
            --json name,state --limit 30)"
          jq -e --arg cs "$CS" 'any(.[]; .name == $cs)' <<< "$LIST" >/dev/null || {
            echo AARIS_ORIGINAL_CODESPACE_UNAVAILABLE; exit 32;
          }
          EXISTING_STATE="$(jq -r --arg cs "$CS" \
            '.[] | select(.name == $cs) | .state' <<< "$LIST")"
          if test "$EXISTING_STATE" != "Available"; then
            gh codespace start -c "$CS" >/dev/null
            echo "NATIVE_CODESPACE_STARTED_FOR_TEST=yes" >> "$GITHUB_ENV"
          fi
          MESH="$RUNNER_TEMP/aaris-original-mesh/mass-package.tar.gz"
          timeout 180 gh codespace ssh -c "$CS" -- \
            'bash -c "umask 077; mkdir -p /tmp/aaris-codespaces/scene-probe; cat > /tmp/aaris-codespaces/scene-probe/verified-tree-mass-package.tar.gz"' \
            < "$MESH" >/dev/null
          REMOTE_SHA="$(timeout 50 gh codespace ssh -c "$CS" -- \
            'sha256sum /tmp/aaris-codespaces/scene-probe/verified-tree-mass-package.tar.gz' \
            | cut -d ' ' -f1 | tr -d '\r\n')"
          test "$REMOTE_SHA" = "234024b842e8cc5e1253607ce41b5a6aebec6a7abd3c9fd81837bc960a24197d" || {
            echo AARIS_REMOTE_MESH_ARCHIVE_HASH_INVALID; exit 33;
          }
          timeout 1850 gh codespace ssh -c "$CS" -- \
            "bash -s -- $EXPECTED_HEAD_SHA" \
            < Tools/Codespaces/interactive_house_probe.sh \
            > native-door-results/safe-native-summary.txt
          echo AARIS_NATIVE_INTERACTIVE_HOUSE_TEST_SUCCEEDED
      - name: Collect genuine Unity PNG images and bounded diagnostic report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          set -euo pipefail
          CS=aaris-ai-unity-ssh-vp5g97jv4r4gfpjgq
          OUT=native-door-results
          mkdir -p "$OUT"
          for BASE in report.json door-closed.png door-open.png window-broken.png door-broken.png; do
            if timeout 45 gh codespace ssh -c "$CS" -- \
              "base64 /tmp/aaris-codespaces/interactive-house-probe/$BASE" \
              2>/dev/null | base64 --decode > "$OUT/$BASE"; then
              test -s "$OUT/$BASE" || rm -f "$OUT/$BASE"
            else
              rm -f "$OUT/$BASE"
            fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path("native-door-results/report.json").read_text())
              assert d["status"] in {"passed","failed"}
              assert d.get("reason","").replace("_","").isalnum()
              print("AARIS_DOOR_REPORT_STATUS="+d["status"])
              print("AARIS_DOOR_REPORT_CATEGORY="+d["reason"])
          except (ValueError,OSError,KeyError,AssertionError):
              print("AARIS_DOOR_REPORT_NOT_READY")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aaris-real-interactive-door-${{ github.run_id }}
          path: native-door-results/
          if-no-files-found: warn
          retention-days: 4
      - name: Stop only if workflow started this Codespace
        if: always() && env.NATIVE_CODESPACE_STARTED_FOR_TEST == 'yes'
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          timeout 120 gh codespace stop -c aaris-ai-unity-ssh-vp5g97jv4r4gfpjgq || true
