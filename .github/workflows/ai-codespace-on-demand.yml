name: Aaris Codespace On-Demand Terminal

on:
  push:
    branches:
      - ai/codespace-jobs
    paths:
      - '.aaris/jobs/*.json'

permissions:
  contents: read

concurrency:
  group: aaris-codespace-on-demand
  cancel-in-progress: false

jobs:
  run-owner-job:
    # Other GitHub accounts cannot trigger the privileged remote workflow.
    if: github.actor == 'sundamunda289-art'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify safe short-lived GitHub authentication broker before any privileged Codespace job
        run: |
          python3 -m py_compile Tools/World/ai_master_github_auth.py Tools/World/ai_codespace_remote.py Tools/World/unity_tmp_editor_installer.py Tools/World/ai_codespace_executor.py Tools/World/unity_cli_auth_bootstrap.py Tools/World/unity_secure_keyring.py
          python3 -m unittest discover -s Tools/World/tests -p 'test_ai_master_github_auth.py' -v
          python3 -m unittest discover -s Tools/World/tests -p 'test_unity_terms_pid_gate.py' -v
          python3 -m unittest discover -s Tools/World/tests -p 'test_unity_shader_issue_filter.py' -v
      - name: Validate job, check Cloudflare-started Codespace, execute directly via SSH
        env:
          AARIS_CODESPACE_TOKEN: ${{ secrets.AARIS_CODESPACE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tools/World/ai_codespace_remote.py \
            --event "$GITHUB_EVENT_PATH" \
            --workspace "$GITHUB_WORKSPACE" \
            --sha "$GITHUB_SHA" \
            --result-dir "$RUNNER_TEMP/aaris-results"
      - name: Preserve machine-readable terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaris-terminal-result-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aaris-results/*.json
            ${{ runner.temp }}/aaris-results/*.jpg
            ${{ runner.temp }}/aaris-results/*.zip
          if-no-files-found: warn
          retention-days: 1