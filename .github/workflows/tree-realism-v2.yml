name: Natural SpeedTree Trunks v2 Source Integrity

on:
  pull_request:
    paths:
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**'
      - 'Assets/AarisWorld/Editor/AarisTreeShapeImporter.cs'
      - 'Tools/World/tree-realism-v2-reviewed.json'
      - 'Tools/World/verify_tree_realism_v2.py'
      - 'Tools/World/verify_tree_house_upgrade.py'
      - 'Tools/World/tree_shapes.py'
      - 'Tools/World/tests/test_tree_realism_v2.py'
      - 'Tools/World/tests/test_speedtree_far_shadow_current_core.py'
      - '.github/workflows/tree-realism-v2.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**'
      - 'Assets/AarisWorld/Editor/AarisTreeShapeImporter.cs'
      - 'Tools/World/tree-realism-v2-reviewed.json'
      - 'Tools/World/verify_tree_realism_v2.py'
      - 'Tools/World/tests/test_tree_realism_v2.py'

permissions:
  contents: read

jobs:
  source-and-collider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare saved Unity YAML inspector
        run: python -m pip install -r Tools/World/requirements.txt
      - name: Source syntax and exact reviewed taper/collider/LOD checks
        run: |
          python -m py_compile Tools/World/verify_tree_realism_v2.py Tools/World/verify_tree_house_upgrade.py Tools/World/tree_shapes.py
          python Tools/World/verify_tree_realism_v2.py
          python -m unittest discover -s Tools/World/tests -p test_tree_realism_v2.py -v
          python -m unittest discover -s Tools/World/tests -p test_tree_shapes.py -v
      - name: Detect accidental binary SpeedTree or GUID source modifications
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          reviewed=json.loads(pathlib.Path('Tools/World/tree-realism-v2-reviewed.json').read_text())
          changed=subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines()
          tree_paths=[p for p in changed if p.startswith('Assets/TerrainDemoScene_URP/Prefabs/Trees/')]
          allowed={r['prefab'] for r in reviewed['profiles']}|{r['source_meta'] for r in reviewed['profiles']}
          # The reviewed six-species MATERIAL-only URP repair is disjoint from
          # existing shape/prefab transactions. Never allow a mixture.
          sys_path=str(pathlib.Path('Tools/World/tests').resolve())
          import sys
          sys.path.insert(0,sys_path)
          from test_foliage_magenta_shader_core import OLD,TREE
          material_paths={TREE+rel for rel in OLD}
          if set(tree_paths)==material_paths:
              subprocess.run(['python','-m','unittest','discover','-s','Tools/World/tests',
                              '-p','test_foliage_magenta_shader_core.py','-v'],check=True)
          else:
              assert set(tree_paths)<=allowed,'Unexpected tree asset edited: '+repr(set(tree_paths)-allowed)
              # Original v2 geometry/import-profile transaction stays atomic (12).
              # Existing 6-prefab far shadow transaction retains exact blob checks.
              if len(tree_paths)==6:
                  assert set(tree_paths)=={row['prefab'] for row in reviewed['profiles']}, 'Non-prefab or partial shadow edit'
                  subprocess.run(['python','-m','unittest','discover','-s','Tools/World/tests',
                                  '-p','test_speedtree_far_shadow_current_core.py','-v'],check=True)
              else:
                  assert len(tree_paths) in (0,12), 'Partial v2 geometry source modification forbidden'
          print(f'SpeedTree integrity: {len(tree_paths)} protected changes; GUIDs and .st binaries untouched')
          PY
