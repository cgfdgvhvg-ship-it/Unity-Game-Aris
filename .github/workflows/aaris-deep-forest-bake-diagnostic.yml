name: Read-only deep forest Unity bake diagnosis
on:
  push:
    branches: ['review/deep-forest-terrain-bake-20261109']
    paths:
      - '.github/workflows/aaris-deep-forest-bake-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Query only fixed native editor error classifications from current Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_PAT }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          timeout 160 gh codespace ssh -c aaris-ai-ubuntu-minimal-jrg7rgvx5rr435wpp -- 'bash -s' <<'SH'
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          folder=pathlib.Path("/tmp/aaris-codespaces/deep-forest-bake")
          report=pathlib.Path("/tmp/aaris-codespaces/deep-forest-bake-report.json")
          if report.is_file():
            try:
              d=json.loads(report.read_text())
              print("bake_report_status="+(d.get("status","missing") if d.get("status") in ("passed","failed") else "other"))
              reason=str(d.get("reason","unknown"))
              print("bake_report_reason="+(reason if re.fullmatch("[A-Z0-9_]{1,96}",reason) else "redacted"))
              print("bake_converted="+str(d.get("converted","unknown")))
              print("bake_tile_count="+str(d.get("terrainTiles","unknown")))
            except (ValueError,OSError,TypeError):print("bake_report_invalid")
          else:print("bake_report_missing")
          p=folder/"private-bake-editor.log"
          if not p.is_file():
            print("native_editor_log_missing")
          else:
            s=p.read_text(errors="replace")[-1000000:]
            signatures={
             "csharp":r"error CS\d{4}",
             "native_crash":r"SIGSEGV|signal 11|segmentation fault|SIGABRT",
             "unity_exception":r"AARIS_NATIVE_DEEP_FOREST_BAKE_FAILED:([A-Z_]+)",
             "missing_method":r"executeMethod.+(not found|error)",
             "invalid_license":r"license.+(invalid|expired|failed|missing)",
             "missing_asset":r"asset.+(not found|missing|import failed)",
             "terrain_error":r"TERRAIN_[A-Z_]+",
             "early_batch_exit":r"Aborting batchmode",
             "index_exception":r"IndexOutOfRangeException",
             "null_exception":r"NullReferenceException",
             "unsupported":r"NotSupportedException",
             "argument":r"ArgumentException"
            }
            for name,pattern in signatures.items():
              m=re.search(pattern,s,re.I)
              print("editor_error_family_"+name+"="+("yes" if m else "no"))
              if name=="unity_exception" and m:print("editor_first_bake_reason="+m.group(1)[:96])
            print("editor_log_bytes="+str(p.stat().st_size))
            extra={
             "project_locked":r"another (instance|process).*using.*project|project.*already (open|in use|locked)",
             "unity_exiting":r"Exiting batchmode|Exiting without crash|Quitting Unity",
             "early_assembly":r"Assembly-CSharp-Editor|ScriptAssembly|assembly[- ]csharp",
             "player_compilation":r"compilation.*(failed|errors)|scripts have compiler errors|Compiler errors",
             "reload_failure":r"(domain reload|ReloadAssembly).*(failed|error)",
             "editor_method":r"AarisDeepForestNativeBake|Bake bounded native deep forest|ExecuteMethod",
             "editor_baker_class":r"AarisDeepForestNativeBake\\.Apply",
             "install_launch_error":r"(Failed to launch|Fatal Error|Error initializing|Error while loading)",
             "asset_import":r"AssetDatabase.*(import|refresh)|AssetImportWorker",
             "editor_batch_error":r"Error building Player|Aborting batchmode|ExecuteMethod class",
             "license_activation":r"(Licensing|License|Entitlement).*?(success|failed|error)",
             "missing_symbol":r"error CS[0-9]{4}|error [A-Z]{2}[0-9]{4}",
             "lfs_pointer":r"git-lfs.github.com/spec/v1",
             "graphics_failed":r"(Graphics Device|GfxDevice|GLCore|OpenGL).*(failed|error|abort)",
             "disk_failed":r"No space left|Disk full|out of disk"
            }
            for name,pattern in extra.items():
                print("editor_marker_"+name+"="+("yes" if re.search(pattern,s,re.I) else "no"))
            for source_name in ("private-bake-stderr.log","private-bake-stdout.log"):
                q=folder/source_name
                if not q.is_file():
                    print(source_name.replace(".log","")+"_missing")
                else:
                    raw=q.read_text(errors="replace")
                    print(source_name.replace(".log","")+"_bytes="+str(len(raw)))
                    for name,pattern in extra.items():
                        if re.search(pattern,raw,re.I):
                            print(source_name.replace(".log","")+"_marker_"+name+"=yes")
            # Last 14 meaningful lifecycle events, only predefined classes:
            ordered=[]
            lifecycle={
               "editor_begin":r"Initialize engine|Initialize Asset Database|Begin MonoManager",
               "project_import":r"AssetDatabase|AssetImportWorker|Import worker|Refresh:|Importing",
               "compilation":r"Compiling Assembly|script compilation|Compilation finished|Bee\\\\",
               "domain":r"Domain Reload|ReloadAssembly|ScriptAssemblies",
               "bake_call":r"AarisDeepForestNativeBake|AARIS_NATIVE_DEEP_FOREST_BAKE",
               "editor_failure":r"^\\s*(error|fatal|exception)|Script.*error|Aborting batchmode",
               "editor_exit":r"Exiting|Quitting|BatchMode|Shutdown",
            }
            for line in s.splitlines()[-140:]:
                for label,expr in lifecycle.items():
                    if re.search(expr,line,re.I):
                        ordered.append(label);break
            print("editor_tail_lifecycle="+",".join(ordered[-14:]))
          PY
          SH
