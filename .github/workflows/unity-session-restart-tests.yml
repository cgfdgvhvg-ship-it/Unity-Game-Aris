name: Unity Codespace Restart Recovery Contract

on:
  pull_request:
    paths:
      - 'Tools/World/unity_session_checkpoint.py'
      - 'Tools/World/tests/test_unity_session_checkpoint.py'
      - '.github/workflows/unity-session-restart-tests.yml'
      - 'Docs/UNITY_AI_RESTART_RECOVERY.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'Tools/World/unity_session_checkpoint.py'
      - 'Tools/World/tests/test_unity_session_checkpoint.py'
      - '.github/workflows/unity-session-restart-tests.yml'

permissions:
  contents: read

jobs:
  safe-restart-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python3 -m py_compile Tools/World/unity_session_checkpoint.py Tools/World/tests/test_unity_session_checkpoint.py
      - name: Verify no-VNC and fail-closed restart planning
        run: python3 -m unittest discover -s Tools/World/tests -p test_unity_session_checkpoint.py -v
