name: URP SpeedTree foliage magenta core regression

on:
  pull_request:
    paths:
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**/Materials/*.mat'
      - 'Tools/World/tests/test_foliage_magenta_shader_core.py'
      - 'ProjectSettings/GraphicsSettings.asset'
      - 'ProjectSettings/QualitySettings.asset'
      - 'Packages/manifest.json'
      - '.github/workflows/foliage-magenta-urp-core.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**/Materials/*.mat'
      - 'Tools/World/tests/test_foliage_magenta_shader_core.py'
      - '.github/workflows/foliage-magenta-urp-core.yml'

permissions:
  contents: read

jobs:
  exact-material-shader-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Verify exact original Git blobs, tint, texture, wind and URP references
        run: python -m unittest discover -s Tools/World/tests -p test_foliage_magenta_shader_core.py -v
      - name: Confirm no unrelated tree, SpeedTree source, collider, or GUID edits
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import pathlib,sys,subprocess
          sys.path.insert(0,str(pathlib.Path('Tools/World/tests').resolve()))
          from test_foliage_magenta_shader_core import OLD,TREE
          changed=set(subprocess.check_output(
              ['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assets={p for p in changed if p.startswith('Assets/')}
          expected={TREE+p for p in OLD}
          assert assets==expected, 'Unexpected or incomplete Unity core edits: '+repr(assets^expected)
          print('Exactly twelve reviewed foliage material shader references; no .meta, .prefab, .st, .unity or textures modified')
          PY
