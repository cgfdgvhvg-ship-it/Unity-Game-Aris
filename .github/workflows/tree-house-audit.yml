name: Inspect tree and house core assets
on:
  push:
    branches: [ai/tree-house-proportions-20261103]
    paths: ['.github/workflows/tree-house-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Materialize saved model geometry within a bounded request
        run: |
          python - <<'PY'
          import pathlib,re,subprocess
          paths=list(pathlib.Path('Assets/AarisWorld/Models').rglob('*.asset'))
          paths+=list(pathlib.Path('Assets/TerrainDemoScene_URP/Terrain/Data').glob('*.asset'))
          size=0
          for p in paths:
              raw=p.read_bytes()
              if raw.startswith(b'version https://git-lfs.github.com/spec/v1'):
                  size+=int(re.search(rb'(?m)^size (\d+)$',raw)[1])
          assert size <= 1024**3, 'Snapshot exceeds the 1GiB request budget'
          subprocess.run(['git','lfs','pull','--include=Assets/AarisWorld/Models/**/*.asset,Assets/TerrainDemoScene_URP/Terrain/Data/*.asset','--exclude='],check=True)
          print('Materialized advertised LFS bytes:',size)
          PY
      - name: Package current source for read-only geometry inspection
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/tree-house-inspection
          UNITY_RUNNER_CONFIGURED: ${{ vars.WORLD_UNITY_RUNNER != '' }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          target=pathlib.Path(os.environ['SNAPSHOT_DIR']);target.mkdir()
          entries=subprocess_paths=None
          import subprocess
          paths=[pathlib.Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          manifest={}
          with zipfile.ZipFile(target/'source.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for p in paths:
                  if p.suffix.lower() in ('.png','.jpg','.jpeg','.tga','.tif','.exr','.psd','.fbx','.st','.glb'):
                      continue
                  data=p.read_bytes();manifest[p.as_posix()]=hashlib.sha256(data).hexdigest()
                  archive.writestr(p.as_posix(),data)
              archive.writestr('INSPECTION_MANIFEST.json',json.dumps(manifest))
          print(json.dumps({'files':len(manifest),'unity_runner_configured':os.environ['UNITY_RUNNER_CONFIGURED'],'source_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-house-source-${{ github.run_id }}
          path: ${{ runner.temp }}/tree-house-inspection/source.zip
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary source snapshot
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/tree-house-inspection"
