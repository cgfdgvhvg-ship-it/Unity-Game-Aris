name: Apply explicit AI core patch
on:
  workflow_dispatch:
    inputs:
      patch_json:
        description: 'Versioned patch with expected_files SHA256, reason and operations; creates a PR'
        required: true
        type: string
      backend:
        type: choice
        options: [python, unity]
        default: python
        description: Native terrain brush requires configured Unity runner
permissions:
  contents: write
  pull-requests: write
jobs:
  edit:
    if: inputs.backend == 'python' || vars.WORLD_UNITY_RUNNER != ''
    runs-on: ${{ inputs.backend == 'unity' && fromJSON(format('["self-hosted","linux","{0}"]', vars.WORLD_UNITY_RUNNER)) || 'ubuntu-latest' }}
    timeout-minutes: 45
    concurrency:
      group: aaris-unity-automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          lfs: ${{ inputs.backend == 'unity' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt Pillow==12.3.0 tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - name: Verify source hashes, apply core patch, run saved-file checks, create PR
        env:
          WORLD_PATCH: ${{ inputs.patch_json }}
          WORLD_BACKEND: ${{ inputs.backend }}
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
          GH_TOKEN: ${{ github.token }}
          AARIS_WORLD_TEMP: ${{ runner.temp }}
        run: python Tools/World/edit_ci.py
