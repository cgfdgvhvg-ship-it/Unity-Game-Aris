name: Native Unity Batched Git LFS Autosync Contracts

on:
  pull_request:
    paths:
      - 'Tools/World/unity_batched_autosync.py'
      - 'Tools/World/unity_actions_batch_sync.py'
      - 'Tools/World/tests/test_unity_actions_batch_sync.py'
      - '.github/workflows/unity-batched-github-upload.yml'
      - 'Tools/World/tests/test_unity_batched_autosync.py'
      - '.github/workflows/unity-batched-autosync-tests.yml'
      - 'Docs/UNITY_BATCHED_AUTOSYNC.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'Tools/World/unity_batched_autosync.py'
      - 'Tools/World/unity_actions_batch_sync.py'
      - 'Tools/World/tests/test_unity_actions_batch_sync.py'
      - '.github/workflows/unity-batched-github-upload.yml'
      - 'Tools/World/tests/test_unity_batched_autosync.py'
      - '.github/workflows/unity-batched-autosync-tests.yml'

permissions:
  contents: read

jobs:
  session-batch-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm Git LFS available
        run: git lfs version
      - name: Python syntax
        run: python3 -m py_compile Tools/World/unity_batched_autosync.py Tools/World/tests/test_unity_batched_autosync.py Tools/World/unity_actions_batch_sync.py Tools/World/tests/test_unity_actions_batch_sync.py
      - name: Isolated real Git + LFS branch transactions and source-preservation tests
        run: |
          python3 -m unittest discover -s Tools/World/tests -p test_unity_batched_autosync.py -v
          python3 -m unittest discover -s Tools/World/tests -p test_unity_actions_batch_sync.py -v
