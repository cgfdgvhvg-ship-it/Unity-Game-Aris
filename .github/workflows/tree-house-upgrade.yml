name: Tree proportions and open house core checks
on:
  push:
    branches: [ai/tree-house-proportions-20261103]
    paths:
      - Tools/World/house-openings-20261103.json
      - Tools/World/tree-proportions-20261103.json
      - .github/workflows/tree-house-upgrade.yml
  pull_request:
    paths:
      - 'Tools/World/**'
      - 'Assets/AarisWorld/Models/**'
      - 'Assets/AarisWorld/Editor/AarisTreeShapeImporter.cs*'
      - 'Assets/TerrainDemoScene_URP/Prefabs/Trees/**'
      - '.github/workflows/tree-house-upgrade.yml'
permissions:
  contents: read
concurrency:
  group: aaris-tree-house-${{ github.ref }}
  cancel-in-progress: false
jobs:
  author-core:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - name: Fetch actual saved geometry and native terrain
        run: git lfs pull --include="Assets/AarisWorld/**/*.asset,Assets/TerrainDemoScene_URP/Terrain/Data/*.asset" --exclude=""
      - name: Preview and apply the exact reviewed core migration
        run: python -u Tools/World/apply_tree_house_upgrade.py
      - name: Verify scripts, source geometry, bindings and actual native terrain
        run: |
          python -m unittest discover -s Tools/World/tests -v
          python Tools/World/check_contracts.py
          python Tools/World/verify_tree_house_upgrade.py
          python Tools/World/native_smoke.py
          python Tools/World/world.py --out "$RUNNER_TEMP/tree-house-verify.json" verify --native --project-checks
      - name: Push only verified core files to this task branch
        env:
          TASK_BRANCH: ai/tree-house-proportions-20261103
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          contract=json.loads(pathlib.Path('Tools/World/tree-house-20261103.postconditions.json').read_text())
          allowed=set(contract['meshes'])|set(contract['tree_source_files'])
          changed=set(git('diff','--name-only').splitlines())
          assert changed<=allowed, 'Unexpected source modifications: '+repr(changed-allowed)
          assert os.environ['GITHUB_REF_NAME']==os.environ['TASK_BRANCH']
          git('fetch','origin',os.environ['TASK_BRANCH'])
          assert git('rev-parse','FETCH_HEAD')==os.environ['GITHUB_SHA'], 'Task branch changed during authoring'
          if changed:
              git('config','user.name','github-actions[bot]')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('add','--',*sorted(changed))
              git('commit','-m','Save reviewed tree import profiles and open residential door/window meshes')
              git('push','origin','HEAD:refs/heads/'+os.environ['TASK_BRANCH'])
          print(json.dumps({'verified_core_paths':len(allowed),'changed_core_files':len(changed),'auto_merged':False,'unity_import_render_physics_tested':False}))
          PY
      - name: Remove temporary verification report
        if: always()
        run: rm -f -- "$RUNNER_TEMP/tree-house-verify.json"
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r Tools/World/requirements.txt tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - run: git lfs pull --include="Assets/AarisWorld/**/*.asset,Assets/TerrainDemoScene_URP/Terrain/Data/*.asset" --exclude=""
      - run: python -m unittest discover -s Tools/World/tests -v
      - run: python Tools/World/check_contracts.py
      - run: python Tools/World/verify_tree_house_upgrade.py
      - run: python Tools/World/native_smoke.py
      - run: python Tools/World/world.py --out "$RUNNER_TEMP/tree-house-verify.json" verify --native --project-checks
      - if: always()
        run: rm -f -- "$RUNNER_TEMP/tree-house-verify.json"
