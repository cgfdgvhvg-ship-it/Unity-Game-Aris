name: Building LOD mesh LFS integrity diagnostics

on:
  pull_request:
    paths:
      - 'Tools/Validation/check_building_mesh_health.py'
      - 'Tools/World/tests/test_building_mesh_health.py'
      - 'Tools/MapBuild/lod_winding.py'
      - 'Tools/MapBuild/ground_native.py'
      - 'Tools/World/tests/test_lod_winding.py'
      - 'Tools/Validation/preview_lod_face_winding.py'
      - 'AGENTS.md'
      - '.github/workflows/building-mesh-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hydrated-native-building-meshes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install numpy==2.3.5 PyYAML==6.0.3
      - name: Compile diagnostics and run corruption regression tests
        run: |
          python -m py_compile Tools/Validation/check_building_mesh_health.py Tools/World/tests/test_building_mesh_health.py Tools/MapBuild/lod_winding.py Tools/MapBuild/ground_native.py Tools/World/tests/test_lod_winding.py Tools/Validation/preview_lod_face_winding.py
          python -m unittest discover -s Tools/World/tests -p test_building_mesh_health.py -v
          python -m unittest discover -s Tools/World/tests -p test_lod_winding.py -v
      - name: Read real 17-building LOD0 LOD1 LOD2 mesh bytes from Git LFS
        run: |
          git lfs install --local
          git lfs pull --include="Assets/AarisWorld/Models/*/Geometry*.asset" --exclude=""
      - name: Validate real serialized vertex and index buffers without writing Unity assets
        run: |
          python Tools/Validation/check_building_mesh_health.py --require-native --json-out /tmp/aaris-building-mesh-health.json
      - name: Calculate bounded candidate face corrections without changing native Unity files
        run: |
          python Tools/Validation/preview_lod_face_winding.py --root . --candidate-dir /tmp/aaris-lod-candidate --json-out /tmp/aaris-lod-face-preview.json > /tmp/aaris-preview-stdout.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/aaris-lod-face-preview.json'))
          assert r['status']=='candidate_only' and r['assets_examined']==34 and not r['original_repo_modified']
          from pathlib import Path
          candidates=list(Path('/tmp/aaris-lod-candidate').rglob('*.asset'))
          assert len(candidates)==r['candidate_assets_changed']
          assert not list(Path('/tmp/aaris-lod-candidate').rglob('*.meta'))
          assert all('Geometry_LOD' in p.name for p in candidates), 'Only LOD1/LOD2 candidates are allowed'
          print('LOD face candidates:',r['candidate_assets_changed'],'faces reoriented:',r['total_faces_reoriented'],'remaining opposing:',r['remaining_opposing_faces'])
          PY
          test -z "$(git status --porcelain -- Assets/AarisWorld/Models Assets/TerrainDemoScene_URP/Scenes)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: building-mesh-health-report
          path: |
            /tmp/aaris-building-mesh-health.json
            /tmp/aaris-lod-face-preview.json
          if-no-files-found: ignore
          retention-days: 3
