name: Building LOD mesh LFS integrity diagnostics

on:
  pull_request:
    paths:
      - 'Tools/Validation/check_building_mesh_health.py'
      - 'Tools/World/tests/test_building_mesh_health.py'
      - 'Tools/MapBuild/lod_winding.py'
      - 'Tools/MapBuild/ground_native.py'
      - 'Tools/World/tests/test_lod_winding.py'
      - 'AGENTS.md'
      - '.github/workflows/building-mesh-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hydrated-native-building-meshes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install numpy==2.3.5 PyYAML==6.0.3
      - name: Compile diagnostics and run corruption regression tests
        run: |
          python -m py_compile Tools/Validation/check_building_mesh_health.py Tools/World/tests/test_building_mesh_health.py Tools/MapBuild/lod_winding.py Tools/MapBuild/ground_native.py Tools/World/tests/test_lod_winding.py
          python -m unittest discover -s Tools/World/tests -p test_building_mesh_health.py -v
          python -m unittest discover -s Tools/World/tests -p test_lod_winding.py -v
      - name: Read real 17-building LOD0 LOD1 LOD2 mesh bytes from Git LFS
        run: |
          git lfs install --local
          git lfs pull --include="Assets/AarisWorld/Models/*/Geometry*.asset" --exclude=""
      - name: Validate real serialized vertex and index buffers without writing Unity assets
        run: |
          python Tools/Validation/check_building_mesh_health.py --require-native --json-out /tmp/aaris-building-mesh-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: building-mesh-health-report
          path: /tmp/aaris-building-mesh-health.json
          if-no-files-found: ignore
          retention-days: 3
