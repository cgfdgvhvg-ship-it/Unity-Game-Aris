name: Save native core refinements
on:
  push:
    branches: [fix/ground-core-refinements-20261103]
    paths:
      - 'Assets/AarisWorld/Scripts/**'
      - 'Tools/MapBuild/road_markings.py'
      - 'Tools/MapBuild/surface_native.py'
      - 'Tools/Validation/check_road_markings.py'
      - '.github/workflows/core-refinements.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aaris-core-refinements-${{ github.ref }}
  cancel-in-progress: false
jobs:
  save-and-check-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline geometry tools
        run: |
          python -m pip install -r Tools/MapBuild/requirements.txt
          python -m pip install tree-sitter==0.26.0 tree-sitter-c-sharp==0.23.5
      - name: Fetch materialized generated meshes
        run: |
          git lfs install --local
          git lfs pull --include="Assets/AarisWorld/**/*.asset"
      - name: Verify projection and save core road marking meshes
        run: |
          python Tools/Validation/check_road_markings.py
          python Tools/MapBuild/surface_native.py
      - name: Check all native mesh buffers and saved player references
        run: |
          python Tools/MapBuild/validate_map.py
          python Tools/Validation/check_explorer.py --native
      - name: Commit validated native meshes and measured reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Docs
          git diff --cached --quiet || git commit -m "Save road paint on actual pavement and refresh native mesh validation"
          git push origin HEAD:"${GITHUB_REF_NAME}"
