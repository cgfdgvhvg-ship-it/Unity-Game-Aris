name: Unity Scratch Reconciliation Safety

on:
  pull_request:
    paths:
      - 'Tools/World/unity_scratch_reconcile.py'
      - 'Tools/World/tests/test_unity_scratch_reconcile.py'
      - '.github/workflows/unity-scratch-reconcile-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/World/unity_scratch_reconcile.py'
      - 'Tools/World/tests/test_unity_scratch_reconcile.py'
      - '.github/workflows/unity-scratch-reconcile-tests.yml'

permissions:
  contents: read

jobs:
  read-only-asset-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python3 -m py_compile Tools/World/unity_scratch_reconcile.py Tools/World/tests/test_unity_scratch_reconcile.py
      - name: Read-only scratch original vs experimental Unity assets
        run: python3 -m unittest discover -s Tools/World/tests -p test_unity_scratch_reconcile.py -v
